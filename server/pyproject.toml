[project]
name = "biz-performance-voice-agent"
version = "0.1.0"
description = "Real-time business-performance calculation engine + voice AI (Phase 1: engine/logging over HTTP)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pandas>=2.0",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "loguru>=0.7",
    "openai>=1.40",
    "anthropic>=0.34",
    "requests>=2.32",
]

[project.optional-dependencies]
# Phase 2 (real voice pipeline) only -- not needed for /ask over HTTP.
voice = ["pipecat-ai[deepseek,runner,sarvam,silero,webrtc]>=1.4.0"]

[dependency-groups]
dev = [
    "pyright>=1.1.404,<2",
    "ruff>=0.12.11,<1",
]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["I", "UP"]
